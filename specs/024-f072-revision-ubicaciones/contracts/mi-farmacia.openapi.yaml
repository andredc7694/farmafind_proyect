openapi: 3.1.0
info:
  title: FarmaFind F07.1/F07.2 — Mi farmacia y revisión de ubicaciones
  version: 0.2.0  # F07.2 (spec 024): historial con REEMPLAZADA y búsqueda de direcciones con centro opcional
  description: >
    Rutas nuevas de F07.1. Las rutas existentes de F07 (propuesta y revisión por farmacia) y del
    perfil privado de la 014 se reutilizan sin cambios. Errores sin detalles internos; 404 ante
    otra farmacia o propuesta inexistente.
paths:
  /api/v1/farmacias/{farmaciaId}/ubicacion:
    get:
      summary: Estado e historial de ubicación de la propia farmacia
      description: Requiere GEO_LOCATION_PROPOSE o pharmacy.profile.read en esa farmacia.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { enum: [SIN_UBICACION, EN_REVISION, VERIFICADA, RECHAZADA] }
                  publicada: { $ref: '#/components/schemas/UbicacionPublica' }
                  historial:
                    type: array
                    items:
                      type: object
                      properties:
                        fecha: { type: string, format: date-time }
                        accion: { enum: [PROPUESTA, APROBACION, RECHAZO, REEMPLAZADA] }
                        autor: { type: string, description: 'Nombre del propio usuario o «Revisión de FarmaFind»' }
                        motivo: { type: [string, 'null'] }
        '404': { description: Sin acceso o farmacia ajena }
  /api/v1/platform/location-proposals:
    get:
      summary: Propuestas pendientes para el administrador de plataforma (solo datos públicos)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/UbicacionPublica'
                    - type: object
                      properties:
                        propuestaId: { type: string, format: uuid }
                        farmaciaNombre: { type: string }
                        version: { type: integer }
                        propuestaAt: { type: string, format: date-time }
        '403': { description: Sin concesión de revisión de plataforma }
  /api/v1/platform/location-proposals/historial:
    get:
      summary: Historial del revisor (F071-FR-017; F07.2 suma REEMPLAZADA)
      parameters:
        - { name: estado, in: query, schema: { enum: [PENDIENTE, APROBADA, RECHAZADA, REEMPLAZADA] } }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagina: { type: integer }
                  porPagina: { type: integer }
                  total: { type: integer }
                  filas:
                    type: array
                    items:
                      type: object
                      properties:
                        propuestaId: { type: string, format: uuid }
                        farmaciaNombre: { type: string }
                        direccion: { type: string }
                        ciudad: { type: string }
                        latitud: { type: number }
                        longitud: { type: number }
                        decision: { enum: [PENDIENTE, APROBADA, RECHAZADA, REEMPLAZADA] }
                        motivo: { type: [string, "null"], description: "En REEMPLAZADA: «Se envió una propuesta más reciente»" }
                        enviadaAt: { type: string, format: date-time }
                        decididaAt: { type: [string, "null"], format: date-time, description: "En REEMPLAZADA: fecha de la propuesta que la reemplazó" }
                        decididoPor: { enum: ["Tú", "Otro revisor de FarmaFind", null] }
        400: { description: Filtro inválido }
        403: { description: Sin concesión de revisión de plataforma }
  /api/v1/farmacias/{farmaciaId}/ubicacion/sugerencias/buscar:
    post:
      summary: «Buscar en el mapa» (F071-FR-013; F07.2 limita a la zona de la ciudad con centro)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [direccion, ciudad]
              properties:
                direccion: { type: string, minLength: 3, maxLength: 240 }
                ciudad: { type: string, minLength: 2, maxLength: 120 }
                centro:
                  type: object
                  additionalProperties: false
                  required: [latitud, longitud]
                  description: Centro de la ciudad de la lista interna; limita a ±0,27° (~30 km). Debe estar dentro del Perú.
                  properties:
                    latitud: { type: number }
                    longitud: { type: number }
      responses:
        200: { description: "{ resultado: { latitud, longitud, etiqueta } | null } (null si no hay resultado dentro de la zona)" }
        400: { description: Campos inválidos o centro fuera del Perú }
        429: { description: Demasiadas consultas }
        503: { description: Búsqueda de direcciones apagada }
  /api/v1/platform/location-proposals/{propuestaId}/decision:
    post:
      summary: Aprobar o rechazar la última propuesta pendiente de una farmacia
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, version, evidenciaConfirmada, motivo]
              properties:
                decision: { enum: [APROBAR, RECHAZAR] }
                version: { type: integer }
                evidenciaConfirmada: { type: boolean }
                motivo: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Decisión registrada }
        '403': { description: Sin concesión, miembro de la farmacia o autor de la propuesta }
        '409': { description: Versión obsoleta o propuesta reemplazada }
  /api/v1/farmacias/{farmaciaId}/horario:
    get:
      summary: Horario privado (P2)
      responses: { '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Horario' } } } } }
    put:
      summary: Guardar horario con versión (P2)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Horario' } } } }
      responses: { '200': { description: Guardado }, '409': { description: Versión obsoleta }, '422': { description: Horas inválidas } }
  /api/v1/farmacias-publicas/horarios:
    get:
      summary: Horarios públicos de farmacias activas (P2)
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string, description: 'Hasta 50 uuid separados por coma' } }
      responses: { '200': { description: 'Mapa farmaciaId → Horario' } }
components:
  schemas:
    UbicacionPublica:
      type: object
      properties:
        direccionPublicable: { type: string, maxLength: 240 }
        ciudad: { type: string }
        latitud: { type: number, minimum: -18.4, maximum: 0.1 }
        longitud: { type: number, minimum: -81.4, maximum: -68.6 }
        fuente: { type: string }
    Horario:
      type: object
      required: [version, dias]
      properties:
        version: { type: integer }
        dias:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            required: [dia, cerrado]
            properties:
              dia: { type: integer, minimum: 1, maximum: 7 }
              cerrado: { type: boolean }
              abre: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
              cierra: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }

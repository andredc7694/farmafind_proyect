openapi: 3.1.0
info:
  title: FarmaFind F08.1 — lecturas nuevas (adición aditiva)
  version: 0.1.0
  description: >
    Tres lecturas de solo lectura. No cambian estados, datos ni permisos. El servidor autoriza cada una
    (capacidad de su módulo) y las filas salen del contexto transaccional con RLS.
servers: [{ url: /api/v1 }]
paths:
  /busquedas/sugerencias:
    get:
      tags: [PublicSuggestions]
      summary: Sugerencias de nombre y presentación a partir de ofertas públicas (máximo 8)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
      responses:
        '200':
          description: Sugerencias (solo proponen; ningún dato privado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suggestions' }
        '400': { description: Consulta inválida }
        '429': { description: Límite temporal de consultas }
  /farmacias/{pharmacyId}/reservas/resumen:
    parameters: [{ $ref: '#/components/parameters/PharmacyId' }]
    get:
      tags: [PharmacySummary]
      summary: Cifras de reservas de la farmacia autorizada
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Resumen de reservas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationSummary' }
        '401': { description: Sin sesión }
        '403': { description: Sin capacidad reservation.read, no es miembro o farmacia ajena }
  /farmacias/{pharmacyId}/inventario/resumen:
    parameters: [{ $ref: '#/components/parameters/PharmacyId' }]
    get:
      tags: [PharmacySummary]
      summary: Cifras de inventario de la farmacia autorizada
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Resumen de inventario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventorySummary' }
        '401': { description: Sin sesión }
        '404': { description: Sin capacidad inventory.read, no es miembro o farmacia ajena }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: ff_session }
  parameters:
    PharmacyId: { name: pharmacyId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Suggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          maxItems: 8
          items:
            type: object
            required: [text, kind]
            additionalProperties: false
            properties:
              text: { type: string }
              kind: { type: string, enum: [NOMBRE, PRESENTACION] }
    ReservationSummary:
      type: object
      required: [generatedAt, pending, confirmed, expiringSoon]
      properties:
        generatedAt: { type: string, format: date-time }
        pending: { type: integer, minimum: 0 }
        confirmed: { type: integer, minimum: 0 }
        expiringSoon: { type: integer, minimum: 0, description: Confirmadas que vencen en 60 minutos o menos. }
    InventorySummary:
      type: object
      required: [generatedAt, products, withoutStock]
      properties:
        generatedAt: { type: string, format: date-time }
        products: { type: integer, minimum: 0 }
        withoutStock: { type: integer, minimum: 0, description: Productos sin cantidad disponible (física menos comprometida ≤ 0). }

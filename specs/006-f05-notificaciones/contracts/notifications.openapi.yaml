openapi: 3.1.0
info:
  title: FarmaFind F05 Internal Notifications
  version: 0.1.0
  description: Contrato interno; no debe exponerse públicamente.
paths:
  /internal/v1/events:
    post:
      summary: Aceptar un evento Outbox de forma durable e idempotente
      parameters:
        - { name: X-FarmaFind-Event-Id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-FarmaFind-Timestamp, in: header, required: true, schema: { type: string, format: date-time } }
        - { name: X-FarmaFind-Signature, in: header, required: true, schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationEvent' }
      responses:
        '202': { description: Evento nuevo aceptado y entregado localmente }
        '200': { description: Reintento idéntico ya procesado }
        '401': { description: Autenticación interna inválida }
        '409': { description: Identidad reutilizada con otra huella }
        '413': { description: Cuerpo mayor a 16 KiB }
        '422': { description: Contrato, versión o tipo inválido }
components:
  schemas:
    NotificationEvent:
      type: object
      additionalProperties: false
      required: [eventId, version, type, pharmacyId, reservationId, correlationId, occurredAt, payload]
      properties:
        eventId: { type: string, format: uuid }
        version: { type: integer, const: 1 }
        type:
          type: string
          enum: [RESERVA_CREADA, RESERVA_CONFIRMADA, RESERVA_ENTREGADA, RESERVA_CANCELADA, RESERVA_EXPIRADA]
        pharmacyId: { type: string, format: uuid }
        reservationId: { type: string, format: uuid }
        correlationId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: false
          required: [reservationId, state]
          properties:
            reservationId: { type: string, format: uuid }
            state: { type: string, enum: [PENDIENTE, CONFIRMADA, ENTREGADA, CANCELADA, EXPIRADA] }

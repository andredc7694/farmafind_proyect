openapi: 3.1.0
info:
  title: FarmaFind F03 Consultas Públicas
  version: 0.1.0-draft
  description: >-
    Contrato propuesto para búsqueda pública referencial. No requiere sesión y no
    expone inventario interno, compromisos, membresías, movimientos ni reservas.
    PostgreSQL es la fuente oficial; una falla Redis usa fallback.
servers:
  - url: /api/v1
tags:
  - name: PublicSearch
paths:
  /busquedas:
    get:
      tags: [PublicSearch]
      summary: Buscar medicamentos y ofertas públicas
      operationId: searchPublicOffers
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - name: precioMinCentavos
          in: query
          schema: { type: integer, minimum: 0 }
        - name: precioMaxCentavos
          in: query
          schema: { type: integer, minimum: 0 }
        - name: orden
          in: query
          schema:
            type: string
            enum: [relevancia, precio_asc, precio_desc, disponibilidad, cercania]
            default: relevancia
        - name: latitud
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitud
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamano
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página de ofertas referenciales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: Fuente oficial temporalmente no disponible; no se usa para una falla exclusiva de Redis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /farmacias/{pharmacyId}:
    get:
      tags: [PublicSearch]
      summary: Consultar perfil público mínimo de una farmacia activa
      operationId: getPublicPharmacy
      parameters:
        - name: pharmacyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Perfil público
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPharmacy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Farmacia inexistente, inactiva o no publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    SearchResponse:
      type: object
      additionalProperties: false
      required: [consulta, ofertas, paginacion, aviso]
      properties:
        consulta: { type: string }
        ofertas:
          type: array
          items: { $ref: '#/components/schemas/PublicOffer' }
        paginacion: { $ref: '#/components/schemas/Pagination' }
        aviso:
          type: string
          const: Precio y disponibilidad referenciales; confirma existencias con la farmacia.
    PublicOffer:
      type: object
      additionalProperties: false
      required:
        - medicamento
        - farmacia
        - precioReferencialCentavos
        - disponibilidadReferencial
        - ultimaRevision
      properties:
        medicamento: { $ref: '#/components/schemas/PublicMedication' }
        farmacia: { $ref: '#/components/schemas/PublicPharmacy' }
        precioReferencialCentavos: { type: integer, minimum: 0 }
        disponibilidadReferencial:
          type: string
          enum: [DISPONIBLE]
        ultimaRevision: { type: string, format: date-time }
        distanciaKm:
          type: [number, 'null']
          minimum: 0
          description: Calculada solo cuando el visitante proporciona ubicación válida.
    PublicMedication:
      type: object
      additionalProperties: false
      required: [id, nombreComercial, principioActivo, concentracion, presentacion, clasificacion]
      properties:
        id: { type: string, format: uuid }
        nombreComercial: { type: string }
        principioActivo: { type: string }
        concentracion: { type: string }
        presentacion: { type: string }
        clasificacion: { type: string }
    PublicPharmacy:
      type: object
      additionalProperties: false
      required: [id, nombre, direccion]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        direccion: { type: string }
    Pagination:
      type: object
      additionalProperties: false
      required: [pagina, tamano, total, totalPaginas]
      properties:
        pagina: { type: integer, minimum: 1 }
        tamano: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Solicitud malformada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Parámetros incompatibles, como cercanía sin ambas coordenadas
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Límite temporal de consultas excedido
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Error interno sin detalles privados
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

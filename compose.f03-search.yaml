name: farmafind-f03-search

services:
  redis:
    image: redis:8.10.3-alpine
    restart: "no"
    command:
      - sh
      - -c
      - exec redis-server --save "" --appendonly no --requirepass "$$(cat /run/secrets/f03_redis_password)"
    secrets:
      - f03_redis_password
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/f03_redis_password) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    tmpfs:
      - /data

secrets:
  f03_redis_password:
    file: ./.cache/f03-docker/redis-password.txt
